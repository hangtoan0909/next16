name: Deploy and Build on Server

on:
  push:
    branches:
      - develop

jobs:
  deploy-develop:
    runs-on: [self-hosted, dev]

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_HATO_KEY }}

      - name: Pull latest code and restart containers
        run: |
          cd /home/sotatek/Project/chaba_fe
          git pull origin develop
          docker compose up -d --build
